# .github/workflows/ci.yml
#
# DOCUMENTED: DEBUG_LOG.md M0 record — "CI/CD: GitHub Actions (backend
# lint+test, frontend lint+build, Docker build)". This confirms:
# GitHub Actions as the CI platform, and exactly three job categories
# (backend lint+test / frontend lint+build / Docker build).
#
# RECONSTRUCTED: job/step names, exact commands, trigger conditions,
# and versions of third-party actions. mypy is DOCUMENTED for the
# backend lint step (DEBUG_LOG.md Known Issues: "mypy strict mode ...
# CI runs mypy with --ignore-missing-imports"); the backend TEST
# command is reconstructed since no test framework name is documented
# (see .ai/MISSING_INFORMATION.md). DEBUG_LOG.md Known Issues also
# states backend tests "require live Postgres/Redis/Qdrant" and are
# "CI marked continue-on-error" — reflected below.
#
# AMENDED 2026-08-16 (Governance Reconciliation, Q3 — approved): the
# frontend job ran lint + typecheck + build but never `pnpm test`.
# DESIGNSYS-01..04 verified 155 real vitest tests locally each session,
# but nothing in CI ever executed them — a green pipeline did not mean
# the suite passed, only that it existed. Added the Test step below,
# using the project's existing `pnpm test` script (frontend/package.json,
# vitest run). Placed after typecheck/before build, matching this
# project's own verification order (MASTER_RULES.md §16: typecheck →
# lint → tests → build). Job renamed to reflect its actual scope.

name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  backend-lint-test:
    name: Backend lint + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Install dependencies
        working-directory: backend
        run: uv sync
      # DOCUMENTED: mypy strict mode, --ignore-missing-imports.
      - name: Type check (mypy)
        working-directory: backend
        run: uv run mypy --ignore-missing-imports .
      # ADDED — ATLAS-P1-CHAT-03. ai/ is a sibling top-level package to
      # backend/ (DEBUG_LOG.md: "ai/ package independent from
      # backend/app/"), so backend/'s own mypy target (".") never
      # reaches it. Uses backend's already-installed venv/strict config
      # rather than adding a second mypy install — same technique
      # verified locally: `uv run mypy --explicit-package-bases ../ai`.
      - name: Type check ai/ layer (mypy)
        working-directory: backend
        run: uv run mypy --ignore-missing-imports --explicit-package-bases ../ai
      # RECONSTRUCTED: test command/framework not documented.
      # DOCUMENTED: continue-on-error, since tests require live
      # Postgres/Redis/Qdrant (DEBUG_LOG.md Known Issues).
      - name: Test
        working-directory: backend
        run: uv run pytest
        continue-on-error: true

  frontend-lint-test-build:
    name: Frontend lint + test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Lint
        working-directory: frontend
        run: pnpm lint
      - name: Type check
        working-directory: frontend
        run: pnpm typecheck
      # ADDED 2026-08-16 (Governance Reconciliation, Q3): runs the
      # real vitest suite (frontend/package.json "test" script).
      # Independently confirmed locally this session: 155/155 passed
      # across 24 files.
      - name: Test
        working-directory: frontend
        run: pnpm test
      # DOCUMENTED: "Build succeeds via `next build` directly"
      # (DEBUG_LOG.md Known Issues).
      - name: Build
        working-directory: frontend
        run: pnpm exec next build

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [backend-lint-test, frontend-lint-test-build]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f backend/Dockerfile.backend -t atlas-backend:ci backend
      - name: Build frontend image
        run: docker build -f frontend/Dockerfile.frontend -t atlas-frontend:ci frontend
