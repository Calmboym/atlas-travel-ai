# pyproject.toml
#
# PROVENANCE — dependencies included below and why:
#   fastapi              DOCUMENTED — ARCHITECTURE.md §6 ("Framework: FastAPI")
#   sqlalchemy            DOCUMENTED — DEBUG_LOG.md M0 ("FastAPI + SQLAlchemy async")
#   alembic                DOCUMENTED — DEBUG_LOG.md M0 ("+ Alembic")
#   asyncpg                RECONSTRUCTED — necessary async PostgreSQL driver for the
#                          documented "SQLAlchemy async" + PostgreSQL combination;
#                          not itself named in any Atlas document.
#   redis                  DOCUMENTED — DEBUG_LOG.md M0 ("+ Redis")
#   qdrant-client          DOCUMENTED — DEBUG_LOG.md M0 ("+ Qdrant")
#   structlog              DOCUMENTED — DEBUG_LOG.md M0 ("structured logging (structlog...)")
#   pydantic-settings      DOCUMENTED — DEBUG_LOG.md Architecture Decisions
#                          ("ai/config.py ... decouples AI config from
#                          pydantic-settings")
#   openai                 RECONSTRUCTED — implied by DEBUG_LOG.md's "OpenAIProvider
#                          implementation" and the documented OPENAI_API_KEY env var;
#                          the SDK package name itself is not stated verbatim.
#   bcrypt                 ADDED — ATLAS-P1-AUTH-02. GUIDELINES.md §11 requires
#                          "Secure password storage" without naming an algorithm.
#                          bcrypt used directly (not the passlib wrapper — passlib's
#                          bcrypt backend has known compatibility gaps with recent
#                          bcrypt releases; this was flagged to the project owner
#                          before implementation, see PROJECT_STATE.md).
#   pyjwt                  ADDED — ATLAS-P1-AUTH-05. Issues the short-lived access
#                          token returned by POST /auth/login. Chosen over
#                          python-jose (older, slower maintenance cadence).
#   email-validator        ADDED — ATLAS-P1-AUTH-02. Required by Pydantic's
#                          EmailStr for real RFC-shape validation on register/login
#                          request schemas (Pydantic raises ImportError without it).
#
# NOT included (see .ai/MISSING_INFORMATION.md for why): uvicorn
# (RECONSTRUCTED — the ASGI server needed to actually run FastAPI; not
# named verbatim in any Atlas document, but omitting it would make the
# documented Dockerfile CMD non-functional, so it is included as a
# framework-necessary reconstruction).
#
# Version numbers: NOT documented anywhere for any package. No
# specific version pins are invented below — see
# .ai/MISSING_INFORMATION.md.

[project]
name = "atlas-backend"
version = "0.1.0"
description = "Atlas AI Travel Platform — backend (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy",
    "alembic",
    "asyncpg",
    "redis",
    "qdrant-client",
    "structlog",
    "pydantic-settings",
    "openai",
    "bcrypt",
    "pyjwt",
    "email-validator",
]

[dependency-groups]
dev = [
    # DOCUMENTED — DEBUG_LOG.md Known Issues: "mypy strict mode may
    # flag untyped external packages ... CI runs mypy with
    # --ignore-missing-imports".
    "mypy",
    # RECONSTRUCTED (previous session) — GUIDELINES.md §14 requires
    # "Unit tests, Integration tests" for the backend but does not name
    # a specific framework. pytest is the conventional choice for this
    # stack; still not independently named by any Design Bible document,
    # but is now the CONFIRMED framework this task's real test suite
    # uses — see .ai/MISSING_INFORMATION.md for the historical flag.
    "pytest",
    # ADDED — ATLAS-P1-AUTH-02. Required for `async def test_*` functions
    # (FastAPI's SQLAlchemy async session + async route handlers can't be
    # exercised with sync pytest alone).
    "pytest-asyncio",
    # ADDED — ATLAS-P1-AUTH-02. ASGI-transport test client
    # (`httpx.AsyncClient(transport=ASGITransport(...))`) — FastAPI's own
    # documented pattern for testing async apps without a running server.
    "httpx",
]

[tool.mypy]
# DOCUMENTED — DEBUG_LOG.md: "mypy strict mode", "--ignore-missing-imports"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
# ADDED — ATLAS-P1-AUTH-02. "auto" avoids requiring an
# `@pytest.mark.asyncio` decorator on every async test function.
asyncio_mode = "auto"
# Session-scoped (not the default function-scoped) event loop: several
# app-level resources are cached module-level singletons bound to
# whichever event loop is running when they're first created
# (SQLAlchemy's async engine in app/db/session.py, the Redis client in
# app/core/redis.py) — exactly how they're used in the real running
# app. A fresh event loop per test function would invalidate those
# connections mid-suite ("RuntimeError: Event loop is closed"),
# discovered by actually running the suite, not assumed.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[build-system]
# RECONSTRUCTED — conventional for uv-managed projects; not
# independently specified by Atlas documentation.
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# ADDED — ATLAS-P1-AUTH-02. Real application code now exists under
# app/ (see removal of [tool.uv] package = false below, and
# .ai/INFRASTRUCTURE_BASELINE.md §8, which named this exact task as
# where that removal was expected). Hatchling's default wheel-packaging
# heuristic looks for a directory matching the distribution name
# ("atlas_backend"), which does not exist — this tells it explicitly
# that "app" is the package to ship instead.
packages = ["app"]
